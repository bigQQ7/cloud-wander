<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云朵漫游记 · 引导预览</title><body style="margin:0;background:linear-gradient(140deg,#536f78,#b5c4b8);min-height:100vh;font-family:system-ui"><nav style="padding:170px 24px 24px;display:flex;gap:12px;flex-wrap:wrap"><button id="one">第一关</button><button id="two">第二关</button><button id="three">第三关</button><button id="walk">WASD</button><button id="jump">空格</button><button id="mouse">鼠标</button><button id="banner">横幅</button><button id="hide">隐藏</button></nav><script type="module">import * as g from './guide.js';for(const [id,n] of [['one',1],['two',2],['three',3]])document.getElementById(id).onclick=()=>g.setChapter(n);walk.onclick=()=>g.showHint('轻按 **WASD**，走进风里的故事',{keys:'wasd',duration:0});jump.onclick=()=>g.showHint('按下 **空格**，轻轻跃过云隙',{keys:'space',duration:0});mouse.onclick=()=>g.showHint('移动 **鼠标**，看看周围的世界',{keys:'mouse',duration:0});banner.onclick=()=>g.showBanner('新的旅途 · **云端初醒**','✧');hide.onclick=()=>{g.hideHint();g.hideBanner()};walk.click();banner.click();</script></body></html>
