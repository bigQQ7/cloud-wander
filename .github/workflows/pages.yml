name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Restore Unity game data
        run: |
          cat levels/chapter3/Build/chapter3.data.unityweb.part* > levels/chapter3/Build/chapter3.data.unityweb
          rm levels/chapter3/Build/chapter3.data.unityweb.part*
          rm -rf .git .github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
