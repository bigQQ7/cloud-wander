<!doctype html><meta charset="utf-8"><title>新增模型检查</title><style>body{font:16px system-ui;background:#e7edf5;margin:20px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}article{background:white;border-radius:12px;padding:10px}img{width:100%;height:300px;object-fit:contain}p{margin:4px}</style><h1>新增模型 · 实物检查</h1><main></main><script type="importmap">{"imports":{"three":"./vendor/three.module.js","../utils/BufferGeometryUtils.js":"./vendor/BufferGeometryUtils.js"}}</script><script type="module">
import * as T from 'three';import{GLTFLoader}from'./vendor/GLTFLoader.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(600,600);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color('#f5f7fb');scene.add(new T.HemisphereLight(0xffffff,0xb5bfd3,2.5));const l=new T.DirectionalLight(0xffefd7,3);l.position.set(4,8,5);scene.add(l);const cam=new T.PerspectiveCamera(35,1,.01,100);const loader=new GLTFLoader();const manifest=await(await fetch('./assets.json')).json();for(const a of manifest.filter(a=>a.id>=38)){const art=document.createElement('article');art.innerHTML=`<p>${a.id} · ${a.name.replaceAll('+',' ')}</p><p>载入中</p>`;document.querySelector('main').append(art);try{const gltf=await loader.loadAsync(a.file);const o=gltf.scene;scene.add(o);const box=new T.Box3().setFromObject(o),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());o.position.sub(center);const r=Math.max(size.x,size.y,size.z);cam.position.set(r*1.65,r*.9,r*1.8);cam.lookAt(0,0,0);renderer.render(scene,cam);const img=document.createElement('img');img.src=renderer.domElement.toDataURL();art.append(img);art.querySelectorAll('p')[1].textContent=`尺寸 ${size.toArray().map(x=>x.toFixed(3)).join(' × ')}`;scene.remove(o);}catch(e){art.append(String(e));}}document.body.dataset.ready='true';
</script>
