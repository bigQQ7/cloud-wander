<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>云朵漫游记 · 关卡地图</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080f29;color:#fff}body{font-family:"Songti SC","Noto Serif CJK SC",serif;background:url('assets/map/bg.png?v=2') center/cover fixed;min-height:100svh;display:grid;place-items:center}.scene{width:min(100vw,177.777svh);aspect-ratio:16/9;position:relative;animation:arrive 1.3s ease both;transition:opacity .65s ease}body.leaving .scene{opacity:0;pointer-events:none}header{position:absolute;top:7%;width:100%;text-align:center}h1{font-size:clamp(24px,3.2vw,58px);font-weight:500;letter-spacing:.3em;margin:0;text-indent:.3em;text-shadow:0 0 24px #b6caff80}header p{font-size:clamp(10px,1vw,16px);letter-spacing:.35em;color:#c8d4ed;margin-top:18px}.routes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 0 5px #fff)}.routes path{fill:none;stroke:#edf4ff;stroke-width:3;stroke-linecap:round;stroke-dasharray:1 19;opacity:.75}.island{position:absolute;left:var(--x);top:var(--y);width:25%;transform:translate(-50%,-50%)}.float{animation:float var(--duration) ease-in-out var(--delay) infinite}.level{position:relative;display:block;width:100%;padding:0;border:0;background:none;color:inherit;cursor:pointer;font:inherit;isolation:isolate}.art{display:block;width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 14px #a6e6ff66);transition:transform .5s,filter .5s}.level:not([aria-disabled=true]):hover .art,.level:not([aria-disabled=true]):focus-visible .art{transform:scale(1.06);filter:drop-shadow(0 0 25px #c2eeffbb)}.level[aria-disabled=true]{cursor:default}.level[aria-disabled=true] .art{filter:drop-shadow(0 0 8px #c5dcff40);opacity:.85}.halo{display:none;position:absolute;inset:-6%;border:1px solid #ffe6a5;border-radius:50%;z-index:-1;box-shadow:0 0 18px #ffe3a536,inset 0 0 18px #ffe3a526;animation:breathe 4.5s ease-in-out infinite}.current .halo{display:none}.current .art{animation:contour-breathe 4.5s ease-in-out infinite}.current:not([aria-disabled=true]):hover .art,.current:not([aria-disabled=true]):focus-visible .art{animation:none;filter:drop-shadow(0 0 2px #ffe6a5) drop-shadow(0 0 7px #ffda80) drop-shadow(0 0 22px #ffe3a580)}@keyframes contour-breathe{0%,100%{filter:drop-shadow(0 0 2px #ffe6a5) drop-shadow(0 0 5px #ffda8090) drop-shadow(0 0 13px #ffe3a545)}50%{filter:drop-shadow(0 0 1px #ffe6a580) drop-shadow(0 0 3px #ffda8050) drop-shadow(0 0 8px #ffe3a525)}}.label{position:absolute;left:50%;top:103%;white-space:nowrap;transform:translate(-50%,7px);padding:10px 21px;border:1px solid #dae4ff30;border-radius:14px;background:#101c39bd;backdrop-filter:blur(10px);font-size:clamp(12px,1.2vw,20px);letter-spacing:.12em;opacity:0;transition:.3s;pointer-events:none}.level:hover .label,.level:focus-visible .label{opacity:1;transform:translate(-50%,0)}.level:focus-visible{outline:1px solid #ffe6a5;outline-offset:14px;border-radius:50%}footer{position:absolute;bottom:7%;width:100%;text-align:center;font:12px system-ui;color:#c6d4edb0;letter-spacing:.25em}#notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#101c39e8;border-radius:14px;padding:12px 22px;font:14px system-ui;text-align:center;max-width:90vw}#notice:empty{display:none}@keyframes float{50%{transform:translateY(-14px)}}@keyframes breathe{50%{opacity:.35;transform:scale(1.035)}}@keyframes arrive{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(hover:none){.label{opacity:1;transform:translate(-50%,0)}}

.scene{z-index:1}.meteor-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}.meteor{position:absolute;width:clamp(90px,12vw,210px);height:2px;opacity:0;background:linear-gradient(90deg,transparent,#b8d8ff90 65%,#fff4d8);border-radius:100%;filter:drop-shadow(0 0 5px #bddcff);transform-origin:right center;animation:shoot var(--flight) ease-out forwards}.meteor::after{content:'';position:absolute;right:0;top:-1px;width:4px;height:4px;border-radius:50%;background:#fff9e8;box-shadow:0 0 9px #e5efff}@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(145deg)}15%{opacity:.85}75%{opacity:.65}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(145deg)}}

.level[aria-disabled=true] .label{top:50%;left:50%;transform:translate(-50%,-50%);z-index:2}
.level[aria-disabled=true]:hover .label,.level[aria-disabled=true]:focus-visible .label{transform:translate(-50%,-50%)}

.routes path{opacity:0}.route-dot{fill:#8293b1;opacity:.22;transition:fill .7s ease,opacity .7s ease,filter .7s ease}#bgm-toggle{display:none!important}.route-dot.lit{fill:#fff4ce;opacity:1;filter:drop-shadow(0 0 5px #fff3c9)}#preview-unlock{position:absolute;right:3%;bottom:3%;border:1px solid #d7e4ff40;border-radius:20px;padding:9px 16px;color:#e4ebff;background:#101c3999;font:12px system-ui;cursor:pointer}#preview-unlock:disabled{opacity:.6;cursor:default}.routes{filter:none}

/* 解锁时保留线稿，叠加彩色图渐显，避免直接切图。 */
.level.revealing .art{animation:island-reveal 1.8s cubic-bezier(.2,.65,.3,1) both}
.reveal-line{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;animation:line-dissolve 1.8s ease both}
.level.revealing::after{content:'';position:absolute;inset:4%;border-radius:50%;background:radial-gradient(ellipse,#ffe9b538, #c6e6ff18 40%,transparent 70%);pointer-events:none;z-index:-1;animation:arrival-glow 1.8s ease both}
@keyframes island-reveal{0%{opacity:0;transform:scale(.97);filter:drop-shadow(0 0 3px #ffe8b5)}45%{opacity:.65;filter:drop-shadow(0 0 24px #ffe8b5aa)}75%{opacity:1;transform:scale(1.025)}100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 13px #ffe3a545)}}
@keyframes line-dissolve{0%,15%{opacity:.85}100%{opacity:0}}
@keyframes arrival-glow{0%{opacity:0;transform:scale(.8)}40%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
</style>
</head>
<body><div id="cloud-opening" hidden><video id="cloud-opening-video" src="assets/opening.mp4?v=1" poster="assets/opening-poster.jpg" playsinline preload="auto"></video><div class="co-veil"></div><p class="co-press">按任意键进入游戏</p></div>
<style>#cloud-opening{position:fixed;inset:0;z-index:100000;background:#000;cursor:pointer;transition:opacity .9s ease}#cloud-opening[hidden]{display:none}#cloud-opening.co-out{opacity:0;pointer-events:none}#cloud-opening video{width:100%;height:100%;object-fit:cover;display:block}#cloud-opening .co-veil{position:absolute;inset:auto 0 0 0;height:32%;background:linear-gradient(transparent,rgba(10,30,60,.35));pointer-events:none}#cloud-opening .co-press{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);margin:0;color:#fff;font:500 clamp(16px,2.2vw,24px) ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.35em;text-shadow:0 2px 12px rgba(0,30,70,.55);opacity:0;transition:opacity .8s;white-space:nowrap}#cloud-opening.co-ready .co-press{opacity:1;animation:co-breathe 2.2s ease-in-out infinite}@keyframes co-breathe{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){#cloud-opening.co-ready .co-press{animation:none}}</style>
<script>
// 开屏：首次打开游戏时播放开屏视频，按任意键或点击进入关卡地图；从关卡返回地图时不再播放
(function(){
 const box=document.getElementById('cloud-opening'),video=document.getElementById('cloud-opening-video');
 let seen=false;try{seen=sessionStorage.getItem('cloud-opening-seen')==='1';}catch{}
 if(seen||/[?&]unlock=/.test(location.search))return;
 box.hidden=false;let done=false;
 const ready=()=>box.classList.add('co-ready');setTimeout(ready,1600);video.addEventListener('ended',ready);
 video.play().catch(()=>{video.muted=true;video.play().catch(()=>{});});
 function enter(e){if(done)return;if(e){e.preventDefault?.();e.stopImmediatePropagation?.();}done=true;try{sessionStorage.setItem('cloud-opening-seen','1');}catch{}box.classList.add('co-out');setTimeout(()=>dispatchEvent(new Event('pointerdown')),0);/* 让背景音乐在同一次按键里启动 */setTimeout(()=>{video.pause();box.remove();},950);removeEventListener('keydown',enter,true);}
 addEventListener('keydown',enter,true);box.addEventListener('pointerdown',enter);
})();
</script>

<div class="meteor-layer" aria-hidden="true"></div>
<main class="scene" aria-label="关卡选择地图">
<header><h1>云朵漫游记</h1><p>循着星光，慢慢出发</p></header>
<svg class="routes" viewBox="0 0 1600 900" aria-hidden="true"><path data-from="1" data-to="2" d="M 430 465 C 540 380 600 480 665 540"/><path data-from="2" data-to="3" d="M 945 565 C 1060 650 1100 455 1190 460"/></svg>
<div id="islands"></div><footer>轻触岛屿 · 开始漫游</footer><button id="preview-unlock" type="button">重置进度</button>
</main><div id="notice" role="status" aria-live="polite"></div>
<script>
// 在 url 中填写相对于 map.html 的关卡网页路径，例如 'level1.html'。
const levels = [
 {id:1,name:'云端初醒',image:'assets/map/island1.png',lineImage:'assets/map/island1-line.png',url:'levels/chapter1/index.html',x:21,y:52},
 {id:2,name:'镜湖花园',image:'assets/map/island2.png',lineImage:'assets/map/island2-line.png',url:'levels/chapter2/index.html',x:50,y:63},
 {id:3,name:'海底',image:'assets/map/island3.png',lineImage:'assets/map/island3-line.png',url:'levels/chapter3/index.html',x:79,y:50}
];
const STORAGE_KEY='cloud-wander-highest-unlocked';
let highest=1, leaving=false, noticeTimer;
function readProgress(){try{const n=Number(localStorage.getItem(STORAGE_KEY));return Number.isInteger(n)&&n>=1?Math.min(n,levels.length):1}catch{return 1}}
function notify(message){document.querySelector('#notice').textContent=message;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>document.querySelector('#notice').textContent='',4000)}
function render(){document.querySelector('#islands').replaceChildren(...levels.map((level,i)=>{
 const locked=level.id>highest, wrapper=document.createElement('div');
 wrapper.className='island';wrapper.style.cssText=`--x:${level.x}%;--y:${level.y}%;--duration:${6+i*.8}s;--delay:${-i*1.7}s`;
 const floating=document.createElement('div');floating.className='float';
 const button=document.createElement('button');button.type='button';button.className='level'+(level.id===highest?' current':'');button.setAttribute('aria-disabled',String(locked));button.setAttribute('aria-label',locked?'未解锁：还看不清……':level.name+(level.id===highest?'，当前关卡':''));
 const halo=document.createElement('span');halo.className='halo';halo.setAttribute('aria-hidden','true');
 const img=document.createElement('img');img.className='art';img.src=locked?level.lineImage:level.image;img.alt='';img.draggable=false;
 const label=document.createElement('span');label.className='label';label.textContent=locked?'还看不清……':level.name;
 button.append(halo,img,label);button.addEventListener('click',()=>{if(locked||leaving)return;if(!level.url.trim()){notify('第三关目前只有 Unity 工程，尚无网页版');return}leaving=true;document.body.classList.add('leaving');setTimeout(()=>location.assign(level.url),matchMedia('(prefers-reduced-motion: reduce)').matches?0:650)});
 floating.append(button);wrapper.append(floating);return wrapper;
}))}
// n 为要解锁的关卡编号：第一关通关后调用 unlockLevel(2)。
let unlocking=false;
const routeGroups=[...document.querySelectorAll('.routes path')].map(path=>{
 const group=document.createElementNS('http://www.w3.org/2000/svg','g');
 const length=path.getTotalLength(),count=Math.ceil(length/19);
 for(let i=0;i<=count;i++){
  const point=path.getPointAtLength(length*i/count);
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('cx',point.x);dot.setAttribute('cy',point.y);dot.setAttribute('r','2.4');dot.classList.add('route-dot');group.append(dot);
 }
 path.after(group);return [...group.children];
});
function renderRoutes(progress){routeGroups.forEach((dots,i)=>dots.forEach(dot=>{dot.style.visibility=progress>=i+1?'visible':'hidden';dot.classList.toggle('lit',progress>=i+2)}))}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function revealIsland(id){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const index=levels.findIndex(level=>level.id===id);
 const button=document.querySelectorAll('.level')[index];
 const line=document.createElement('img');line.src=levels[index].lineImage;line.alt='';line.className='reveal-line';
 button.append(line);button.classList.add('revealing');
 await wait(1800);
 line.remove();button.classList.remove('revealing');
}
async function animateUnlock(target,preview=false){
 if(unlocking)return false;
 unlocking=true;
 const previewButton=document.querySelector('#preview-unlock');previewButton.disabled=true;
 const saved=highest;
 try{
  if(preview){highest=1;render();renderRoutes(1);await wait(500)}
  for(let next=highest+1;next<=target;next++){
   const dots=routeGroups[next-2];
   // 从暗到亮：圆点依次渐亮，像光沿着路线流过去
   for(const dot of dots){dot.style.visibility='visible';dot.classList.add('lit');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)await wait(70)}
   await wait(700);
   highest=next;render();renderRoutes(highest);
   await revealIsland(next);
   if(!preview){try{localStorage.setItem(STORAGE_KEY,String(highest));localStorage.setItem(REVEALED_KEY,String(highest))}catch{notify('浏览器未允许保存进度，本次解锁仍然有效')}}
   await wait(400);
  }
  if(preview){await wait(1800);highest=saved;render();renderRoutes(highest)}
  return true;
 }finally{unlocking=false;previewButton.disabled=false}
}
window.unlockLevel=function(n){if(!Number.isInteger(n)||n<1||n>levels.length||unlocking)return Promise.resolve(false);return animateUnlock(n)};
document.querySelector('#preview-unlock').addEventListener('click',()=>{if(confirm('重置所有关卡进度？')){localStorage.setItem(STORAGE_KEY,'1');localStorage.setItem('cloud-wander-revealed','1');highest=1;render();renderRoutes(1)}});

// 地图上“已经展示过”的进度：关卡通关时会先把进度存好再跳回来，这里从上次展示的位置开始播放点亮动画
const REVEALED_KEY='cloud-wander-revealed';
{const saved=readProgress();let revealed=1;try{revealed=Number(localStorage.getItem(REVEALED_KEY))||1;}catch{}
 const n=Math.max(saved,Number(new URLSearchParams(location.search).get('unlock'))||0);
 highest=Math.min(revealed,saved,n||saved);render();renderRoutes(highest);
 if(n>highest&&n<=levels.length)setTimeout(()=>animateUnlock(n),900);else{try{localStorage.setItem(REVEALED_KEY,String(saved))}catch{}}}
addEventListener('storage',e=>{if(e.key===STORAGE_KEY||e.key===null){highest=readProgress();render();renderRoutes(highest)}});
addEventListener('pageshow',e=>{leaving=false;document.body.classList.remove('leaving');if(!e.persisted||unlocking)return;/* 只在从浏览器缓存返回时刷新，避免打断点亮动画 */highest=readProgress();render();renderRoutes(highest)});

// 流星每隔 5–10 秒出现，隐藏页面和减少动态效果模式下暂停。
const meteorLayer=document.querySelector('.meteor-layer');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let meteorTimer;
function scheduleMeteor(delay=5000+Math.random()*5000){
 clearTimeout(meteorTimer);
 if(document.hidden||reducedMotion.matches)return;
 meteorTimer=setTimeout(()=>{
  const star=document.createElement('span');star.className='meteor';
  const distance=Math.min(innerWidth*.42,650);
  star.style.cssText=`left:${40+Math.random()*55}%;top:${5+Math.random()*35}%;--dx:${-distance}px;--dy:${distance*.7}px;--flight:${1.4+Math.random()*.8}s`;
  meteorLayer.append(star);
  star.addEventListener('animationend',()=>star.remove(),{once:true});
  scheduleMeteor();
 },delay);
}
function refreshMeteors(){meteorLayer.replaceChildren();scheduleMeteor()}
document.addEventListener('visibilitychange',refreshMeteors);
reducedMotion.addEventListener('change',refreshMeteors);
scheduleMeteor(2000);
</script>
<script type="module">import {createBGM} from './levels/shared/bgm.js?v=bgm3';createBGM('map');</script>
</body>
</html>
